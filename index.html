<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TGM Office Pantry</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#F3F4F1; --panel:#FFFFFF; --panel2:#ECEEE9; --ink:#1B211E; --muted:#5F6862; --line:#D9DDD6;
  --accent:#2C4FA3; --accent-ink:#FFFFFF; --accent-soft:#E3E9F7;
  --good:#1F7A4D; --good-soft:#DDF0E5; --warn:#A86500; --warn-soft:#FBEBD0; --bad:#B42F2F; --bad-soft:#F8DEDC;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131715; --panel:#1B201D; --panel2:#232925; --ink:#E7EBE8; --muted:#9AA39D; --line:#323A35;
    --accent:#86A5F0; --accent-ink:#0F1A33; --accent-soft:#1F2A45;
    --good:#5CC48E; --good-soft:#15301F; --warn:#E8A94A; --warn-soft:#352711; --bad:#EE7C74; --bad-soft:#3A1A18;
  }
}
:root[data-theme="dark"]{
  --bg:#131715; --panel:#1B201D; --panel2:#232925; --ink:#E7EBE8; --muted:#9AA39D; --line:#323A35;
  --accent:#86A5F0; --accent-ink:#0F1A33; --accent-soft:#1F2A45;
  --good:#5CC48E; --good-soft:#15301F; --warn:#E8A94A; --warn-soft:#352711; --bad:#EE7C74; --bad-soft:#3A1A18;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-inline:16px;padding-block:0 48px}
.wrap{max-width:960px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:22px 14px}
h1{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:30px;line-height:1;margin:0}
h1 small{display:block;font-family:var(--body);font-stretch:100%;font-weight:500;font-size:13px;color:var(--muted);margin-top:6px}
h2{font-family:var(--display);font-stretch:85%;font-weight:700;font-size:19px;margin:0 0 10px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px;font-weight:600}
select,input,button{font:inherit;color:inherit}
select,input[type=text],input[type=number],input[type=date]{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
input[type=number]{font-family:var(--mono);font-size:14px}
button{cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel);padding:7px 12px;font-weight:600}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:4px 8px}
button.danger{color:var(--bad)}
button:disabled{opacity:.6}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:18px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav.tabs button{border:0;background:none;border-bottom:3px solid transparent;border-radius:0;padding:10px 14px;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi .v{font-family:var(--display);font-stretch:80%;font-weight:700;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.cat td{background:var(--panel2);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:5px 8px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-good{background:var(--good-soft);color:var(--good)} .p-acc{background:var(--accent-soft);color:var(--accent)}
.meter{width:70px;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle}
.meter i{display:block;height:100%}
.muted{color:var(--muted)} .small{font-size:12.5px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
.lines{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.line{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(70px,.8fr) minmax(100px,1fr) auto;gap:8px;align-items:center}
@media (max-width:520px){.line{grid-template-columns:1fr 1fr auto}.line select{grid-column:1/-1}}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:0 6px 6px 0;font-size:13.5px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:7px;font-weight:600;z-index:20}
.status{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.empty{padding:18px 0;color:var(--muted);text-align:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{border:0;border-radius:0;background:none;padding:7px 14px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px}

/* ---------- phone layout ---------- */
@media (max-width:640px){
  body{padding-inline:12px}
  h1{font-size:26px}
  header.top{padding-block:16px 8px}
  select,input[type=text],input[type=number],input[type=date]{font-size:16px;padding:10px}
  button{padding:10px 14px;min-height:44px}
  button.ghost{min-height:40px}
  nav.tabs button{padding:12px 12px;font-size:14px}
  .card{padding:12px}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .kpi{padding:10px}
  .kpi .v{font-size:18px;overflow-wrap:anywhere}
  .kpi h3{font-size:10.5px;letter-spacing:.04em}
  .kpi .s{font-size:11.5px}
  .seg{display:flex;width:100%}
  .seg button{flex:1;padding:10px 4px}
  .foot{justify-content:stretch}
  .foot button,.row > .primary{flex:1}
  .tbl{overflow-x:visible}
  table.resp,table.resp tbody{display:block}
  table.resp thead{display:none}
  table.resp tr{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;padding:10px 2px;border-bottom:1px solid var(--line)}
  table.resp tr:last-child{border-bottom:0}
  table.resp tr.cat{display:block;padding:0;border:0;margin-top:8px}
  table.resp tr.cat td{display:block;border-radius:4px}
  table.resp td{display:block;border:0;padding:0;text-align:left}
  table.resp td.empty{grid-column:1/-1;text-align:center}
  table.resp td[data-l]{display:flex;justify-content:space-between;align-items:center;gap:8px}
  table.resp td[data-l]::before{content:attr(data-l);font-family:var(--body);font-size:12px;color:var(--muted);text-transform:none}
  table.resp td.nm{grid-column:1/-1;font-weight:600}
  table.resp td.hz{display:none}
  /* stock: name + status on top line */
  table.rs tr{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 8px}
  table.rs td.nm{grid-column:1/4}
  table.rs td.pl{grid-column:4;grid-row:1;justify-self:end}
  table.rs td[data-l]{flex-direction:column;align-items:flex-start;gap:0;font-size:14px}
  table.rs td[data-l]::before{font-size:11px}
  table.rs td.hz{display:flex;visibility:hidden}
  table.rs .meter{display:none}
  /* count: big input */
  table.rc tr{grid-template-columns:1fr auto;align-items:center}
  table.rc td.nm{grid-column:1/-1}
  table.rc td:last-child input{width:110px!important}
  /* log */
  table.rl tr{grid-template-columns:auto 1fr auto;align-items:center}
  table.rl td.nm{grid-column:1/-1;grid-row:2;font-weight:400}
  table.rl td.pd{justify-self:end}
  table.rl td:last-child{grid-column:1/-1;justify-self:end}
  /* items: labelled fields */
  table.ri td.nm input{width:100%!important;min-width:0!important}
  table.ri td[data-l]{flex-direction:column;align-items:stretch;gap:3px}
  table.ri td[data-l] input,table.ri td[data-l] select{width:100%!important}
  table.ri td.ac{grid-column:1/-1;justify-self:end}
  .line{grid-template-columns:1fr 1fr auto}
  .row > label.f{flex:1 1 140px}
  #status{margin-top:12px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Office Pantry<small>Buy and track office stock</small></h1>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="main"><div class="empty">Loading stock…</div></main>
  <p class="status" id="status"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const R = v => "R " + (Math.round((v||0)*100)/100).toLocaleString("en-ZA",{minimumFractionDigits:2,maximumFractionDigits:2});
const q = v => (Math.round((v||0)*10)/10).toLocaleString("en-ZA");
const today = () => new Date().toISOString().slice(0,10);
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };

const CATS = ["Kitchen","Cleaning","Toilet"];
const catOf = i => CATS.includes(i?.category)? i.category : "Kitchen";
const parOf = i => i.parLevel!=null ? +i.parLevel : (+(i.par?.a||0))+(+(i.par?.b||0));
let db=null, items=[], txns=[], ready={items:false,txns:false};
let tab = store.get("tab3","stock"); if(!["stock","buy","count","log","items"].includes(tab)) tab="stock";
let catFilter = store.get("cat","all");
let buyLines = [{item:"",qty:"",total:""}];
let pendingDelete = null;
const TABS = [["stock","Stock"],["buy","Record purchase"],["count","Stock count"],["log","Log"],["items","Items"]];
const activeItems = () => items.filter(i=>!i.archived).sort((a,b)=>CATS.indexOf(catOf(a))-CATS.indexOf(catOf(b))||a.name.localeCompare(b.name));
const setTab = t => { tab=t; store.set("tab3",t); pendingDelete=null; };

// one shared stock pool: purchases add, counts reset to the counted number
function engine(){
  const evs = txns.slice().sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0));
  const oh = {}, lastPrice = {}; let lastCount = null;
  for(const ev of evs){
    for(const l of ev.lines||[]){
      const qty = +l.qty||0;
      if(ev.type==="purchase"){ oh[l.item]=(oh[l.item]||0)+qty; if(qty&&+l.total) lastPrice[l.item]={unit:l.total/qty,date:ev.date}; }
      else if(ev.type==="count"){ oh[l.item]=qty; }
    }
    if(ev.type==="count" && (!lastCount || ev.date>lastCount)) lastCount=ev.date;
  }
  const price = id => lastPrice[id]?.unit ?? (+items.find(i=>i.id===id)?.refPrice||0);
  return {oh, price, lastCount, lastPrice};
}

function render(){
  $("#tabs").innerHTML = TABS.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${k===tab}">${l}</button>`).join("");
  if(!ready.items||!ready.txns) return;
  const E = engine();
  $("#main").innerHTML = ({stock,buy,count,log,items:itemsView})[tab](E);
}

// ---------- Stock ----------
function stock(E){
  const rows = activeItems().filter(it=>catFilter==="all"||catOf(it)===catFilter).map(it=>{
    const have = Math.max(0, E.oh[it.id]||0), par = parOf(it);
    const need = par? Math.max(0, Math.ceil(par-have)) : 0;
    const ratio = par? have/par : 1;
    const state = !par? "none" : have<=0? "out" : ratio<=0.3? "low" : need>0? "top" : "ok";
    return {it,have,par,need,ratio,state,cost:need*E.price(it.id)};
  });
  const urgent = rows.filter(r=>r.state==="out"||r.state==="low");
  const toBuy = rows.filter(r=>r.need>0);
  const total = toBuy.reduce((s,r)=>s+r.cost,0), urgentTotal = urgent.reduce((s,r)=>s+r.cost,0);
  const days = E.lastCount? Math.round((new Date(today())-new Date(E.lastCount))/864e5) : null;
  const pill = {out:'<span class="pill p-bad">Out</span>',low:'<span class="pill p-warn">Low</span>',top:'<span class="pill p-acc">Top up</span>',ok:'<span class="pill p-good">OK</span>',none:'<span class="muted small">no par</span>'};
  const mc = {out:"var(--bad)",low:"var(--warn)",top:"var(--accent)",ok:"var(--good)",none:"var(--line)"};
  let cat=null;
  const body = rows.map(r=>{
    const c = catOf(r.it); const head = c!==cat ? (cat=c, `<tr class="cat"><td colspan="6">${c}</td></tr>`) : "";
    return head + `<tr class="st-${r.state}"><td class="nm">${esc(r.it.name)} <span class="muted small">${esc(r.it.unit||"")}</span></td>
      <td class="n" data-l="On hand">${q(r.have)} <span class="meter"><i style="width:${Math.min(100,r.ratio*100)}%;background:${mc[r.state]}"></i></span></td>
      <td class="n muted" data-l="Par">${r.par?q(r.par):"—"}</td><td class="pl">${pill[r.state]}</td>
      <td class="n${r.need?"":" hz"}" data-l="Buy"><b>${r.need||""}</b></td><td class="n${r.need?"":" hz"}" data-l="Cost">${r.need?R(r.cost):""}</td></tr>`;
  }).join("");
  let cur=null;
  const list = toBuy.map(r=>{ const c=catOf(r.it); const h=c!==cur?(cur=c,`\n${c.toUpperCase()}\n`):""; return `${h}- ${r.need} x ${r.it.name}${r.it.unit?` (${r.it.unit})`:""}`; }).join("\n");
  return `
  <div class="kpis">
    <div class="kpi"><h3>Out or low</h3><div class="v" style="color:${urgent.length?"var(--bad)":"var(--good)"}">${urgent.length}</div><div class="s">${urgent.length?`buy now · ${R(urgentTotal)}`:"nothing urgent"}</div></div>
    <div class="kpi"><h3>Full top-up</h3><div class="v">${R(total)}</div><div class="s">${toBuy.length} items at Checkers prices</div></div>
    <div class="kpi"><h3>Last count</h3><div class="v" style="color:${days===null||days>7?"var(--warn)":"var(--ink)"}">${days===null?"Never":days===0?"Today":days+" d ago"}</div><div class="s">${days===null||days>7?"count before you shop":"stock figures are current"}</div></div>
  </div>
  <div class="seg" role="group" aria-label="Category" style="margin-bottom:10px">${[["all","All"],...CATS.map(c=>[c,c])].map(([k,l])=>`<button data-cat="${k}" aria-pressed="${catFilter===k}">${l}</button>`).join("")}</div>
  <div class="card"><div class="tbl"><table class="resp rs">
    <thead><tr><th>Item</th><th class="n">On hand</th><th class="n">Par</th><th>Status</th><th class="n">Buy</th><th class="n">Cost</th></tr></thead>
    <tbody>${body||`<tr><td colspan="6" class="empty">No items here. Add them under Items.</td></tr>`}</tbody>
  </table></div>
  ${toBuy.length?`<div class="foot"><button id="copyList">Copy shopping list</button><button class="primary" id="fillBuy">Record the purchase</button></div>`:""}
  </div>
  <textarea id="listText" hidden>${esc(`Shopping list${catFilter==="all"?"":" · "+catFilter} · ${today()}\n${list}\n\nEstimated: ${R(total)}`)}</textarea>
  <p class="small muted"><b>Par</b> = the most you should hold. On hand = last count plus purchases since then.</p>`;
}

// ---------- Buy ----------
function itemOptions(sel){
  return `<option value="">Choose item…</option>` + CATS.map(c=>`<optgroup label="${c}">${activeItems().filter(i=>catOf(i)===c).map(i=>`<option value="${i.id}" ${i.id===sel?"selected":""}>${esc(i.name)}${i.unit?` (${esc(i.unit)})`:""}</option>`).join("")}</optgroup>`).join("");
}
function buy(E){
  const total = buyLines.reduce((s,l)=>s+(+l.total||0),0);
  return `<div class="card">
  <div class="note">Copy the till slip: quantity and the <b>amount paid</b> for each line.</div>
  <div class="row">
    <label class="f">Date<input type="date" id="b_date" value="${today()}"></label>
    <label class="f" style="flex:1;min-width:150px">Store<input type="text" id="b_supplier" value="Checkers"></label>
  </div>
  <div class="lines">${buyLines.map((l,i)=>{
    const unit = (+l.qty && +l.total)? l.total/l.qty : 0; const lp = E.lastPrice[l.item];
    const warn = unit && lp && unit > lp.unit*1.05 ? `<div class="small" style="grid-column:1/-1;color:var(--bad)">${R(unit)} each: more than the ${R(lp.unit)} paid on ${lp.date}.</div>` : "";
    return `<div class="line">
      <select id="bl_item_${i}" data-bl="${i}" data-f="item" aria-label="Item">${itemOptions(l.item)}</select>
      <input type="number" id="bl_qty_${i}" min="0" step="any" placeholder="Qty" data-bl="${i}" data-f="qty" value="${esc(l.qty)}" aria-label="Quantity">
      <input type="number" id="bl_total_${i}" min="0" step="0.01" placeholder="Paid R" data-bl="${i}" data-f="total" value="${esc(l.total)}" aria-label="Amount paid">
      <button class="ghost" data-delline="${i}" aria-label="Remove line">✕</button>${warn}</div>`;}).join("")}
  </div>
  <div class="row"><button id="addLine">Add line</button><button id="fillList">Fill from shopping list</button><span style="flex:1"></span>
    <b style="font-family:var(--mono)">${R(total)}</b>
    <button class="primary" id="saveBuy">Save purchase</button></div>
  </div>`;
}

// ---------- Count ----------
function count(E){
  let cat=null;
  return `<div class="card">
  <div class="note">Count what is on the shelves, in the cupboards and in the fridge, once a week. Leave blank anything you didn't count.</div>
  <div class="row"><label class="f">Count date<input type="date" id="c_date" value="${today()}"></label></div>
  <div class="tbl" style="margin-top:12px"><table class="resp rc"><thead><tr><th>Item</th><th class="n">System says</th><th class="n">Counted</th></tr></thead><tbody>
  ${activeItems().map(i=>{ const c=catOf(i); const head=c!==cat?(cat=c,`<tr class="cat"><td colspan="3">${c}</td></tr>`):"";
    return head+`<tr><td class="nm">${esc(i.name)} <span class="muted small">${esc(i.unit||"")}</span></td><td class="n muted" data-l="System says">${q(Math.max(0,E.oh[i.id]||0))}</td><td class="n"><input type="number" min="0" step="any" id="c_${i.id}" data-count="${i.id}" style="width:90px" aria-label="Counted ${esc(i.name)}"></td></tr>`;}).join("")}
  </tbody></table></div>
  <div class="foot"><button class="primary" id="saveCount">Save count</button></div>
  </div>`;
}

// ---------- Log ----------
function log(){
  const list = txns.slice().sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0)).slice(0,50);
  const name = id => items.find(i=>i.id===id)?.name || "Removed item";
  return `<div class="card">${list.length?`<div class="tbl"><table class="resp rl"><thead><tr><th>Date</th><th>Type</th><th>Details</th><th class="n">Paid</th><th></th></tr></thead><tbody>
  ${list.map(t=>`<tr><td class="dt">${t.date}</td>
    <td>${t.type==="purchase"?'<span class="pill p-acc">Purchase</span>':'<span class="pill p-good">Count</span>'}</td>
    <td class="nm"><div class="small">${t.type==="count"?`${(t.lines||[]).length} items counted`:(t.lines||[]).map(l=>`${q(l.qty)} × ${esc(name(l.item))}`).join(", ")}</div>${t.supplier?`<div class="small muted">${esc(t.supplier)}</div>`:""}</td>
    <td class="n pd">${t.type==="purchase"?R((t.lines||[]).reduce((s,l)=>s+(+l.total||0),0)):""}</td>
    <td><button class="ghost danger" data-del="${t.id}">${pendingDelete===t.id?"Tap again to delete":"Delete"}</button></td></tr>`).join("")}
  </tbody></table></div>`:`<div class="empty">Nothing recorded yet.</div>`}</div>`;
}

// ---------- Items ----------
function itemsView(E){
  const list = items.slice().sort((a,b)=>(a.archived?1:0)-(b.archived?1:0)||CATS.indexOf(catOf(a))-CATS.indexOf(catOf(b))||a.name.localeCompare(b.name));
  const catSel = (id,val,attrs) => `<select id="${id}" ${attrs}>${CATS.map(c=>`<option ${c===val?"selected":""}>${c}</option>`).join("")}</select>`;
  return `<div class="card">
  <h2>Items &amp; par levels</h2>
  <p class="small muted">Set par to about two weeks of use. Price is used for estimates until you record a purchase.</p>
  <div class="tbl"><table class="resp ri"><thead><tr><th>Item</th><th>Unit</th><th>Category</th><th class="n">Par</th><th class="n">Price R</th><th></th></tr></thead><tbody>
  ${list.map(i=>`<tr style="${i.archived?"opacity:.5":""}">
    <td class="nm"><input type="text" id="it_name_${i.id}" data-item="${i.id}" data-f="name" value="${esc(i.name)}" style="width:100%;min-width:150px"></td>
    <td data-l="Unit"><input type="text" id="it_unit_${i.id}" data-item="${i.id}" data-f="unit" value="${esc(i.unit||"")}" style="width:110px"></td>

    <td class="n" data-l="Par"><input type="number" min="0" id="it_par_${i.id}" data-item="${i.id}" data-f="parLevel" value="${parOf(i)||""}" style="width:70px"></td>
    <td class="n" data-l="Price R"><input type="number" min="0" step="0.01" id="it_ref_${i.id}" data-item="${i.id}" data-f="refPrice" value="${i.refPrice??""}" style="width:85px"></td>
    <td class="ac"><button class="ghost" data-archive="${i.id}">${i.archived?"Restore":"Remove"}</button></td></tr>`).join("")}
  </tbody></table></div>
  <div class="row" style="margin-top:14px;border-top:1px solid var(--line);padding-top:14px">

// ---------- writes ----------
function toast(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function fail(e){ toast(e?.code==="quota_exceeded"?"Storage full: delete old entries in Log":"Couldn't save. Check your connection and try again."); console.error(e); }
async function addTxn(doc){ if(!db){ toast("Saving isn't available in this view"); return false; } try{ await db.collection("txns").add({...doc,office:"main",ts:Date.now()}); return true; }catch(e){ fail(e); return false; } }
const timers={}; const later=(k,fn)=>{ clearTimeout(timers[k]); timers[k]=setTimeout(fn,600); };
function shoppingLines(){
  const E=engine();
  return activeItems().filter(it=>catFilter==="all"||catOf(it)===catFilter).map(it=>({it,need:Math.max(0,Math.ceil(parOf(it)-Math.max(0,E.oh[it.id]||0)))})).filter(x=>x.need>0).map(x=>({item:x.it.id,qty:String(x.need),total:""}));
}

document.addEventListener("click", async e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.tab){ setTab(t.dataset.tab); render(); window.scrollTo(0,0); return; }
  if(t.dataset.cat){ catFilter=t.dataset.cat; store.set("cat",catFilter); render(); return; }
  if(t.id==="addLine"){ buyLines.push({item:"",qty:"",total:""}); render(); return; }
  if(t.dataset.delline!=null){ buyLines.splice(+t.dataset.delline,1); if(!buyLines.length) buyLines=[{item:"",qty:"",total:""}]; render(); return; }
  if(t.id==="fillList"||t.id==="fillBuy"){
    const l=shoppingLines(); if(!l.length){ toast("Nothing to buy — everything is at par"); return; }
    buyLines=l; setTab("buy"); render(); window.scrollTo(0,0); toast("Filled. Enter what you paid per line"); return;
  }
  if(t.id==="copyList"){
    try{ await navigator.clipboard.writeText($("#listText").value); toast("Shopping list copied"); }catch(err){ toast("Copy blocked by the browser"); }
    return;
  }
  if(t.id==="saveBuy"){
    const lines=buyLines.filter(l=>l.item&&+l.qty>0).map(l=>({item:l.item,qty:+l.qty,total:+l.total||0}));
    if(!lines.length){ toast("Add at least one item with a quantity"); return; }
    if(lines.some(l=>!l.total)){ toast("Every line needs the amount paid"); return; }
    t.disabled=true;
    if(await addTxn({type:"purchase",date:$("#b_date").value||today(),supplier:$("#b_supplier").value.trim(),lines})){ buyLines=[{item:"",qty:"",total:""}]; toast("Purchase saved · stock updated"); setTab("stock"); }
    t.disabled=false; render(); return;
  }
  if(t.id==="saveCount"){
    const lines=[...document.querySelectorAll("[data-count]")].filter(i=>i.value!=="").map(i=>({item:i.dataset.count,qty:+i.value}));
    if(!lines.length){ toast("Enter at least one counted quantity"); return; }
    t.disabled=true;
    if(await addTxn({type:"count",date:$("#c_date").value||today(),lines})){ toast(`Count saved · ${lines.length} items`); setTab("stock"); }
    t.disabled=false; render(); return;
  }
  if(t.dataset.del){
    if(pendingDelete!==t.dataset.del){ pendingDelete=t.dataset.del; render(); return; }
    pendingDelete=null; try{ await db.doc("txns/"+t.dataset.del).delete(); toast("Deleted"); }catch(err){ fail(err); } return;
  }
  if(t.dataset.archive){ const it=items.find(i=>i.id===t.dataset.archive); try{ await db.doc("items/"+it.id).update({archived:!it.archived}); }catch(err){ fail(err); } return; }
  if(t.id==="bkOut"){
    const blob=new Blob([db.exportJSON()],{type:"application/json"}); const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=`office-pantry-backup-${today()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    return;
  }
  if(t.id==="bkIn"){ $("#bkFile").click(); return; }
  if(t.id==="addItem"){
    const name=$("#n_name").value.trim(); if(!name){ toast("Give the item a name"); return; }
    try{ await db.collection("items").add({name,unit:$("#n_unit").value.trim(),category:$("#n_cat").value,parLevel:+$("#n_par").value||0,refPrice:+$("#n_price").value||0,archived:false}); toast("Item added"); }catch(err){ fail(err); }
    return;
  }
});

document.addEventListener("input", e=>{
  const el=e.target;
  if(el.dataset.bl!=null){
    buyLines[+el.dataset.bl][el.dataset.f]=el.value;
    later("bl",()=>{ const a=document.activeElement, id=a?.id, pos=a?.selectionStart; render(); const n=id&&document.getElementById(id); if(n){ n.focus(); try{ if(pos!=null) n.setSelectionRange(pos,pos); }catch(_){} } });
    return;
  }
  if(el.dataset.item){
    const id=el.dataset.item, f=el.dataset.f;
    const patch = (f==="refPrice"||f==="parLevel")? {[f]:+el.value||0} : {[f]:el.value};
    later("it"+id+f, async()=>{ try{ await db.doc("items/"+id).update(patch); }catch(err){ fail(err); } });
  }
});

 ["milk","Milk full cream (Crystal Valley)","2L bottle","Kitchen",12,36.99],
 ["coffee","Instant coffee (Ricoffy)","750g tin","Kitchen",4,168.99],
 ["tea","Rooibos tea (Freshpak)","box of 80","Kitchen",4,56.99],
 ["blacktea","Black tea (Joko)","box of 100","Kitchen",2,64.99],
 ["sugar","White sugar (Selati)","2.5kg bag","Kitchen",4,65.99],
 ["creamer","Coffee creamer (Cremora)","750g box","Kitchen",2,69.99],
 ["water","Still water (Thirsti)","6 x 1.5L pack","Kitchen",6,79.99],
 ["biscuits","Biscuits (Eet-Sum-Mor)","200g pack","Kitchen",8,36.99],
 ["cups","Disposable cups (Checkers Housebrand)","pack of 50","Kitchen",4,74.99],

 ["toiletpaper","Toilet paper 2-ply (Checkers Housebrand)","pack of 18","Toilet",4,119.99],
 ["handsoap","Hand wash (Renew)","500ml","Toilet",6,42.99]
];
const LS_KEY = "tgm-office-pantry-v1";
function makeLocalDb(){
  let data;
  try{ data = JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){ data=null; }
  if(!data || !data.items){
    data = {items:{}, txns:{}};
    for(const [id,name,unit,category,parLevel,refPrice] of SEED) data.items[id]={name,unit,category,parLevel,refPrice,archived:false};
  }
  const subs = {items:[], txns:[]};
  const save = () => { try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){ toast("Browser storage is full or blocked"); } };
  const snap = col => ({docs:Object.entries(data[col]).map(([id,d])=>({id,data:()=>d}))});
  const emit = col => subs[col].forEach(cb=>cb(snap(col)));
  const newId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  save();
  window.addEventListener("storage", e=>{ if(e.key===LS_KEY){ try{ data=JSON.parse(e.newValue); emit("items"); emit("txns"); }catch(_){} } });
  return {
    local:true,
    collection:(col)=>({
      add: async d => { const id=newId(); data[col][id]=JSON.parse(JSON.stringify(d)); save(); emit(col); return {id}; },
      onSnapshot: (cb) => { subs[col].push(cb); setTimeout(()=>cb(snap(col)),0); return ()=>{}; }
    }),
    doc:(path)=>{ const [col,id]=path.split("/"); return {
      update: async p => { if(!data[col][id]) throw new Error("missing"); data[col][id]={...data[col][id],...p}; save(); emit(col); },
      delete: async () => { delete data[col][id]; save(); emit(col); }
    };},
    exportJSON: () => JSON.stringify({app:"tgm-office-pantry",exported:new Date().toISOString(),...data},null,1),
    importJSON: text => { const d=JSON.parse(text); if(!d.items||!d.txns) throw new Error("Not a pantry backup"); data={items:d.items,txns:d.txns}; save(); emit("items"); emit("txns"); }
  };
}

document.addEventListener("change", async e=>{
  if(e.target.id!=="bkFile"||!e.target.files[0]) return;
  try{ db.importJSON(await e.target.files[0].text()); toast("Backup restored"); }catch(err){ toast("That file isn't a pantry backup"); }
});


// ---------- Supabase (shared data for all devices) ----------
const SUPABASE_URL = "https://qniikykxjpnepdshasuo.supabase.co";
const SUPABASE_KEY = "sb_publishable_GZz2dQS9KSdymU_Fs8bClA_96Ok4i7N";
async function makeSupabaseDb(){
  if(!window.supabase || SUPABASE_KEY.startsWith("PASTE")) return null;
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const cache = {items:{}, txns:{}}; const subs = {items:[], txns:[]}; const errs = {items:[], txns:[]};
  const snap = col => ({docs:Object.entries(cache[col]).map(([id,d])=>({id,data:()=>d}))});
  const emit = col => subs[col].forEach(cb=>cb(snap(col)));
  async function load(col){
    const {data,error} = await sb.from(col).select("id,data");
    if(error){ errs[col].forEach(f=>f(error)); return false; }
    cache[col] = Object.fromEntries(data.map(r=>[r.id,r.data])); emit(col); return true;
  }
  const newId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const chk = ({error}) => { if(error) throw error; };
  for(const col of ["items","txns"]){
    sb.channel("rt-"+col).on("postgres_changes",{event:"*",schema:"public",table:col},()=>load(col)).subscribe();
  }
  setInterval(()=>{ if(document.visibilityState==="visible"){ load("items"); load("txns"); } }, 30000);
  return {
    shared:true,
    collection:(col)=>({
      add: async d => { const id=newId(); chk(await sb.from(col).insert({id,data:d})); cache[col][id]=d; emit(col); return {id}; },
      onSnapshot: (cb, err) => { subs[col].push(cb); if(err) errs[col].push(err); load(col); return ()=>{}; }
    }),
    doc:(path)=>{ const [col,id]=path.split("/"); return {
      update: async p => { const next={...(cache[col][id]||{}),...p}; chk(await sb.from(col).update({data:next}).eq("id",id)); cache[col][id]=next; emit(col); },
      delete: async () => { chk(await sb.from(col).delete().eq("id",id)); delete cache[col][id]; emit(col); }
    };}
  };
}

// ---------- boot ----------
render();
(async()=>{
  db = window.claude ? await window.claude.use("db") : null;
  if(!db) db = await makeSupabaseDb();
  if(!db) db = makeLocalDb();
  const err = e => { $("#status").textContent = db.shared ? "Can't reach the database. Check your connection, then reload." : "Live updates paused. Reload the page to reconnect."; if(db.shared && !ready.items) $("#main").innerHTML=`<div class="empty">Can't load stock from the database: ${esc(e.message||"")}</div>`; console.error(e); };
  const busy = () => { const a=document.activeElement; return a && (a.dataset?.item||a.dataset?.count||a.dataset?.bl!=null||/^(n_|b_|c_date)/.test(a.id||"")); };
  db.collection("items").onSnapshot(s=>{ items=s.docs.map(d=>({id:d.id,...d.data()})); ready.items=true; if(!busy()) render(); }, err);
  db.collection("txns").onSnapshot(s=>{ txns=s.docs.map(d=>({id:d.id,...d.data()})); ready.txns=true; $("#status").innerHTML = db.local ? `${txns.length} records · saved on this device only <button class="ghost" id="bkOut">Download backup</button><button class="ghost" id="bkIn">Restore backup</button><input type="file" id="bkFile" accept=".json,application/json" hidden>` : `${txns.length} records · ${db.shared?"shared across all devices":"live"}`; if(!busy()) render(); }, err);
})();
})();
</script>
